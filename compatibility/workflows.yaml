schema_version: "1"
baseline_version: null
workflows:
  - id: synthetic-1d-processing
    status: experimental
    input_profile: mathematical-complex-fully-sampled
    output_profile: nmrnext-hdf5
    entry_points: [cli, python-api, optional-qt]
    recipe: examples/process-1d.json
    evidence: [tests/unit/test_operations.py, tests/reference/test_production_reference.py, tests/cli/test_cli.py]
    real_acquisition_validation: unavailable
  - id: synthetic-2d-hypercomplex-processing
    status: experimental
    input_profile: mathematical-states-fully-sampled
    preserved: [all-four-quadrature-channels, axis-metadata, provenance]
    recipe: examples/process-2d.json
    evidence: [tests/reference/test_production_reference.py, tests/gui/test_workbench.py, tests/cli/test_cli.py]
    legacy_numerical_equivalence: unverified
  - id: processed-spectrum-conversion
    status: experimental
    formats: [nmrnext-hdf5, nmrpipe-real, ucsf-real]
    evidence: tests/io/test_codecs.py
    loss_policy: explicit-per-code-acknowledgment
    independent_check: test-only-header-and-payload-decoder
    established_external_consumer: unverified
  - id: bruker-raw-1d-inspection
    status: experimental
    profile: controlled-acqus-fid
    evidence: [tests/io/test_codecs.py, tests/io/test_bruker_public.py]
    real_vendor_fixture: hash-pinned-public-bmse000001-1H
    processing: "explicit positive recorded GRPDLY correction before FFT; unknown/zero delay blocked"
  - id: public-bruker-1d-to-native
    status: experimental
    input_profile: controlled-complex-bruker-raw-1d
    output_profile: nmrnext-hdf5
    recipe: examples/bruker-1d-public.json
    evidence: [tests/fixtures/bruker_public_manifest.json, tests/io/test_bruker_public.py, tools/validate_public_bruker.py]
    independent_reference: eight-archived-topspin-peak-positions-only
    nmrpipe_parity: unverified
    independent_export_consumer: unverified
  - id: public-bruker-2d-to-native
    status: experimental
    input_profile: "fully sampled FnMODE 5/6, AQSEQ 0, AQ_mod 3, positive recorded GRPDLY"
    output_profile: nmrnext-hdf5
    recipes: [examples/bruker-2d-hsqc-public.json, examples/bruker-2d-tocsy-public.json]
    evidence: [tests/fixtures/bruker2d_public_manifest.json, tests/io/test_bruker2d_public.py, tests/cli/test_bruker2d_public_cli.py, tests/gui/test_bruker2d_public_gui.py, tools/validate_public_bruker2d.py]
    reference_scope: "two acquired datasets of one compound; fixed peaks and relative-volume ratios within predeclared 30% gate"
    concentrations_and_absolute_vendor_parity: unverified
  - id: bounded-frequency-analysis
    status: experimental
    input_profile: fully-frequency-domain-1d-or-2d
    features: [complex-1d-and-full-hypercomplex-2d-automatic-phase, signed-1d-2d-peak-extrema, rectangular-relative-integrals, optional-figures]
    evidence: [tests/test_analysis.py, tests/cli/test_analysis_cli.py, tests/cli/test_plot_cli.py, tests/plot/test_figures.py]
    real_quantitative_validation: unverified
  - id: researcher-workbench
    status: experimental
    current_increment: [per-axis-settings, frequency-source-index-crop, last-applied-workflow-bundle-for-cli-replay, bounded-analysis-and-optional-figures]
    replay_scope: native-source-snapshot-and-strict-relative-path-json-recipe
    evidence: [tests/gui/test_workbench.py, tests/test_workflow_bundle.py]
    real_acquisition_validation: "bounded public 1d plus two acquired 2d controller pipelines; no broad vendor or concentration claim"
    user_observation_sessions: not-yet-run
  - id: public-varian-protein-nmrpipe13-case
    status: experimental
    acceptance: "scoped PASS as of code commit 03cd13aa1517f19cd5f2f4933be9292c8020e061; one previously studied public case, not a holdout"
    output_profiles: [nmrpipe-real, ucsf-real]
    evidence: docs/laboratory-workflow-results.md
    reference_and_consumers: "NMRPipe 13, NMRDraw 13 and Sparky 3.115 for the fixed case and files only"
    broader_nmrpipe_parity_and_lab_reliability: unverified
  - id: bounded-native-file-processing
    status: experimental
    input_profile: "native schema-1 HDF5; fully sampled, uncompressed/unfiltered, bounded chunks or contiguous"
    output_profile: nmrnext-hdf5
    dimensions: [1, 2, 3, 4]
    backend: "native, one thread"
    coordinate_scope: "acquired 3D/4D examples have relative Hz; no ppm anchor or original processed reference"
    excluded: [raw-vendor-3d-4d-import, digital-filter-correction, global-analysis, gui-lazy-view, high-dimensional-nmrpipe-ucsf-export]
    evidence: [tests/io/test_block_lifecycle.py, docs/block-processing-results.md]
  - id: first-real-laboratory-raw-to-export
    status: unsupported
    blockers: [broader-permitted-real-fixtures, quantitative-phase-and-integral-reference, independent-export-consumer, nmrpipe-parity]
  - id: legacy-script-migration
    status: unsupported
  - id: complete-native-nmrpipe-suite
    status: unsupported
    inventory: "Seed preserved in functions.yaml; exact installation inventory not frozen"
