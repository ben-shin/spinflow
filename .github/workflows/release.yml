name: Build experimental release assets

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-character source commit to build
        required: true
        type: string

# Building assets never creates a tag or publishes a release.
permissions:
  contents: read

jobs:
  wheels:
    name: Ubuntu 24.04 / CPython ${{ matrix.python }} release wheel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require an exact source revision
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and installer-test tools
        run: python -m pip install --only-binary=:all: 'build==1.4.0' 'pytest==9.2.0'
      - name: Test installer guards
        run: python -m pytest -q tests/tools/test_release_install.py
      - name: Build wheel and one source distribution
        run: |
          if [ '${{ matrix.python }}' = '3.12' ]; then
            python -m build
          else
            python -m build --wheel
          fi
          python tools/release_assets.py checksums dist
      - name: Install core binary assets into a spaced prefix
        run: |
          # Restrict executable lookup to the selected Python directory. This
          # consumer check cannot find a C/C++ compiler or build executable.
          export PATH="$(dirname "$(command -v python)")"
          python -c "import shutil; assert all(shutil.which(name) is None for name in ('cc', 'c++', 'gcc', 'g++', 'clang', 'cmake', 'ninja'))"
          python tools/install.py --asset-dir dist --prefix "$RUNNER_TEMP/Spin Flow core"
          python tools/install.py --asset-dir dist --prefix "$RUNNER_TEMP/Spin Flow core"
          python tools/release_assets.py smoke --prefix "$RUNNER_TEMP/Spin Flow core"
          "$RUNNER_TEMP/Spin Flow core/bin/python" -I -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('PySide6', 'matplotlib', 'pytest', 'pybind11', 'cmake', 'ninja'))"
      - name: Install Qt runtime libraries for optional viewer check
        if: matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Add and smoke optional GUI and figure dependencies
        if: matrix.python == '3.13'
        run: |
          export PATH="$(dirname "$(command -v python)")"
          python tools/install.py --asset-dir dist --prefix "$RUNNER_TEMP/Spin Flow core" --gui --plot
          python tools/install.py --asset-dir dist --prefix "$RUNNER_TEMP/Spin Flow core"
          python tools/release_assets.py smoke --prefix "$RUNNER_TEMP/Spin Flow core" --gui --plot
      - name: Record actual installed dependency and native versions
        run: |
          tag="cp$(python -c 'import sys; print("%d%d" % sys.version_info[:2])')"
          python tools/release_assets.py record --output "dist/build-$tag.json" --prefix "$RUNNER_TEMP/Spin Flow core" --commit "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: release-build-${{ matrix.python }}
          path: dist/
          if-no-files-found: error

  assemble:
    name: Assemble checksummed experimental assets
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-build-*
          path: incoming
      - name: Assemble wheels, source distribution, installer and manifest
        run: python tools/release_assets.py assemble --input incoming --output release-assets --commit "$SOURCE_SHA"
      - name: Check final release checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: spinflow-experimental-release-assets
          path: release-assets/
          if-no-files-found: error
