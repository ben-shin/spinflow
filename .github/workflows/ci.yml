name: Linux build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Ubuntu 24.04 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: bash tools/bootstrap.sh --test
      - name: Build in-place extension for source-path tests
        run: .venv/bin/python tools/build_native.py
      - name: Test headless source checkout
        # Real Qt and optional Matplotlib tests run in the complete GUI/plot job.
        run: .venv/bin/python -m pytest -q --ignore=tests/gui --ignore=tests/plot --ignore=tests/cli/test_plot_cli.py -k 'not test_gui_'
      - name: Build wheel and source distribution
        run: |
          .venv/bin/python -m pip install 'build==1.4.0'
          .venv/bin/python -m build
      - name: Exercise installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/spinflow-wheel"
          "$RUNNER_TEMP/spinflow-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/spinflow-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/spinflow-wheel/bin/python" -I "$GITHUB_WORKSPACE/tools/ci_smoke.py"
      - name: Exercise source distribution outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/spinflow-sdist"
          "$RUNNER_TEMP/spinflow-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/spinflow-sdist/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/spinflow-sdist/bin/python" -I "$GITHUB_WORKSPACE/tools/ci_smoke.py"

  plot-headless:
    name: Ubuntu 24.04 / Python 3.13 / plot without Qt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install plot and test extras in a fresh Qt-free environment
        run: bash tools/bootstrap.sh --plot --test
      - name: Confirm Qt is absent
        run: .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
      - name: Test actual CLI figure export and report validation
        run: .venv/bin/python -m pytest -q tests/cli/test_plot_cli.py

  gui:
    name: Ubuntu 24.04 / Python 3.13 / Qt offscreen
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install project and GUI/plot test dependencies
        run: bash tools/bootstrap.sh --gui --plot --test
      - name: Require the clean Essentials GUI profile
        run: |
          .venv/bin/python -I -c "import importlib.metadata as m; import PySide6; assert m.version('PySide6-Essentials') == m.version('shiboken6') == PySide6.__version__ == '6.12.0'; installed={d.metadata['Name'].lower().replace('-','_') for d in m.distributions()}; assert not installed.intersection({'pyside6','pyside6_addons','pyside6_webengine','pyside6_pdf'})"
          .venv/bin/python -I -m pip check
      - name: Build in-place extension for source-path tests
        run: .venv/bin/python tools/build_native.py
      - name: Fetch public Agilent acquisitions for GUI workflows
        run: .venv/bin/python tests/fixtures/fetch_varian_public.py --root .artifacts/coverage-formats
      - name: Test complete source suite with Qt
        env:
          SPINFLOW_VARIAN_ROOT: ${{ github.workspace }}/.artifacts/coverage-formats
        run: .venv/bin/python -m pytest -q
      - name: Capture the installed synthetic Workbench on X11
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: xcb
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb xauth openbox x11-utils libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          wd=$(mktemp -d "$RUNNER_TEMP/workbench.XXXXXXXX")
          .venv/bin/python -I -m pip wheel --no-deps --wheel-dir "$wd" .
          wheels=("$wd"/*.whl)
          test "${#wheels[@]}" = 1
          python -m venv "$wd/env"
          "$wd/env/bin/python" -I -m pip install "${wheels[0]}[gui]"
          "$wd/env/bin/python" -I -m pip check
          cd "$wd"
          export XDG_RUNTIME_DIR="$wd/xdg" HOME="$wd/home"
          mkdir -m 700 "$XDG_RUNTIME_DIR" "$HOME"
          timeout -k 5 135 xvfb-run -a -s '-screen 0 1600x1200x24 -nolisten tcp' bash -euc '
            openbox --sm-disable >openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true; wait $wm || true" EXIT
            for i in {1..50}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              kill -0 "$wm"
              sleep .1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            ulimit -t 60
            ulimit -f 65536
            ulimit -v 4194304
            timeout -k 5 120 "$1" -I -B "$2/tools/ci_gui_demo.py" "$2" "$3" "$4"
            kill -0 "$wm"
          ' capture "$wd/env/bin/python" "$GITHUB_WORKSPACE" "${wheels[0]}" "$RUNNER_TEMP/synthetic-workbench"
      - name: Retain synthetic X11 screenshots and verification files
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-workbench-x11
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/synthetic-workbench/01-fid-processing.png
            ${{ runner.temp }}/synthetic-workbench/02-signed-contours.png
            ${{ runner.temp }}/synthetic-workbench/03-batch-results.png
            ${{ runner.temp }}/synthetic-workbench/04-right-drag-box.png
            ${{ runner.temp }}/synthetic-workbench/fid-input.nmrh5
            ${{ runner.temp }}/synthetic-workbench/fid-result.nmrh5
            ${{ runner.temp }}/synthetic-workbench/designed-spectrum.npy
            ${{ runner.temp }}/synthetic-workbench/applied-reference.nmrh5
            ${{ runner.temp }}/synthetic-workbench/Applied recipe/source.nmrh5
            ${{ runner.temp }}/synthetic-workbench/Applied recipe/workflow.json
            ${{ runner.temp }}/synthetic-workbench/Synthetic labels.json
            ${{ runner.temp }}/synthetic-workbench/Synthetic series.json
            ${{ runner.temp }}/synthetic-workbench/sample-A.nmrh5
            ${{ runner.temp }}/synthetic-workbench/sample-B.nmrh5
            ${{ runner.temp }}/synthetic-workbench/sample-A-result.nmrh5
            ${{ runner.temp }}/synthetic-workbench/sample-B-result.nmrh5
            ${{ runner.temp }}/synthetic-workbench/batch-results.csv
            ${{ runner.temp }}/synthetic-workbench/batch-results.json
            ${{ runner.temp }}/synthetic-workbench/receipt.json

  public-bruker:
    name: Ubuntu 24.04 / public Bruker 1D and 2D
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install native processor and test dependencies
        run: bash tools/bootstrap.sh --test
      - name: Build in-place extension for source-path tests
        run: .venv/bin/python tools/build_native.py
      - name: Fetch and verify the nine public BMRB files
        run: .venv/bin/python tests/fixtures/fetch_bruker_public.py
      - name: Validate the declared Bruker correction and archived peak positions
        run: |
          .venv/bin/python -m pytest -q tests/io/test_bruker_public.py
          .venv/bin/python tools/validate_public_bruker.py
      - name: Fetch and verify the 25 public 2D BMRB files
        run: .venv/bin/python tests/fixtures/fetch_bruker2d_public.py
      - name: Validate acquired 2D phase, peaks, physical volumes and headless CLI replay
        env:
          SPINFLOW_BRUKER2D_ROOT: ${{ github.workspace }}/.artifacts/bruker2d-realdata/bmse000001
        run: |
          .venv/bin/python -m pytest -q tests/io/test_bruker2d_public.py tests/cli/test_bruker2d_public_cli.py
          .venv/bin/python tools/validate_public_bruker2d.py --backend numpy
          .venv/bin/python tools/validate_public_bruker2d.py --backend native
      - name: Fetch public Agilent acquisitions and stored reference spectra
        run: .venv/bin/python tests/fixtures/fetch_varian_public.py --root .artifacts/coverage-formats
      - name: Validate Agilent import and difficult public spectrum
        env:
          SPINFLOW_VARIAN_ROOT: ${{ github.workspace }}/.artifacts/coverage-formats
        run: |
          .venv/bin/python -m pytest -q tests/io/test_varian_public.py tests/io/test_hard_spectra_public.py tests/cli/test_analysis_crop_public.py
          .venv/bin/python tools/validate_public_varian.py --root .artifacts/coverage-formats --backend numpy
          .venv/bin/python tools/validate_public_varian.py --root .artifacts/coverage-formats --backend native
          .venv/bin/python tools/validate_public_hard_spectra.py --root .artifacts/coverage-formats
